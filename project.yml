name: CodeIOS
options:
  bundleIdPrefix: com.codeios
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  CodeIOS:
    type: application
    platform: iOS
    sources:
      # Swift sources only; the web workbench and extension store are added by CI
      # into Sources/CodeIOS/Resources and pulled in as a folder reference below.
      - path: Sources/CodeIOS
        excludes:
          - "Resources/**"
      - path: Sources/CodeIOS/Resources
        type: folder
    dependencies:
      - package: ZIPFoundation
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: VS Code
        CFBundleShortVersionString: "0.1.5"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeios.vscode
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule

  Probe:
    type: application
    platform: iOS
    sources:
      - path: Sources/Probe
    info:
      path: Support/ProbeInfo.plist
      properties:
        CFBundleDisplayName: CodeIOS Probe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeios.probe
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
