name: ios

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch workbench + extension store
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund vscode-web@1.91.1
          mkdir -p Sources/CodeIOS/Resources
          rm -rf Sources/CodeIOS/Resources/Web Sources/CodeIOS/Resources/Extensions Sources/CodeIOS/Resources/Web.zip pack
          # Ship one archive instead of ~720 loose files: sideloaders upload files
          # individually over AFC and a large parallel upload is where installs break.
          mkdir -p pack
          cp -R node_modules/vscode-web/dist pack/Web
          cp -R extensions pack/Extensions
          test -f pack/Web/out/vs/code/browser/workbench/workbench.html
          ( cd pack && zip -qry ../Sources/CodeIOS/Resources/Web.zip Web Extensions )
          rm -rf pack
          ls -lh Sources/CodeIOS/Resources/Web.zip
          unzip -l Sources/CodeIOS/Resources/Web.zip | tail -2

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CodeIOS.xcodeproj \
            -scheme CodeIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Build probe (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CodeIOS.xcodeproj \
            -scheme Probe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee probe.log

      - name: Package probe IPA
        run: |
          set -euo pipefail
          rm -rf ProbePayload Probe-unsigned.ipa
          mkdir -p ProbePayload
          cp -R build/Build/Products/Release-iphoneos/Probe.app ProbePayload/
          zip -qryD Probe-unsigned.ipa ProbePayload
          ls -lh Probe-unsigned.ipa

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/CodeIOS.app"
          test -d "$APP"
          rm -rf Payload CodeIOS-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'VS Code'" Payload/CodeIOS.app/Info.plist || true
          # -D: no directory entries. Some sideloaders compute the bundle root by
          # assuming every zip entry is a file, and choke on "Payload/" itself.
          zip -qryD CodeIOS-unsigned.ipa Payload
          # also ship the bare .app bundle for tools that want it
          ditto -c -k --keepParent Payload/CodeIOS.app CodeIOS-app.zip
          ls -lh CodeIOS-unsigned.ipa
          shasum -a 256 CodeIOS-unsigned.ipa

      - name: Verify IPA metadata
        run: |
          set -euo pipefail
          unzip -l CodeIOS-unsigned.ipa | grep -q "Payload/CodeIOS.app/Info.plist" \
            || { echo "Info.plist missing from IPA"; exit 1; }
          unzip -p CodeIOS-unsigned.ipa Payload/CodeIOS.app/Info.plist > /tmp/ip.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" /tmp/ip.plist \
            | grep -qx "com.codeios.vscode" || { echo "bundle id wrong"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" /tmp/ip.plist \
            | grep -qx "CodeIOS" || { echo "executable wrong"; exit 1; }
          echo "IPA metadata ok"

      - uses: actions/upload-artifact@v4
        with:
          name: CodeIOS-ipa
          path: |
            CodeIOS-unsigned.ipa
            CodeIOS-app.zip
            Probe-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
